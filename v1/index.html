<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FieldBar POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F172A">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#0EA5E9; --good:#22c55e;
    --warn:#f59e0b; --bad:#ef4444; --ink:#0b1220;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:30}
  header h1{font-size:17px;margin:0;flex:1}
  .btn{background:var(--accent);color:#04141f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--txt)}
  .btn.sm{padding:7px 10px;font-size:13px}
  .tabbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--muted);white-space:nowrap;cursor:pointer;font-size:13px;font-weight:600}
  .tab.on{background:var(--accent);color:#04141f}
  .view{display:none;padding:14px 16px 90px}
  .view.on{display:block}
  .grid{display:grid;gap:10px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .pcard{background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;border:1px solid transparent}
  .pcard:active{transform:scale(.97)}
  .pcard .nm{font-weight:700}
  .pcard .pr{color:var(--accent);font-weight:700;margin-top:4px}
  .pcard .st{color:var(--muted);font-size:12px;margin-top:6px}
  .pcard.low .st{color:var(--warn)}
  .ticket{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid var(--accent)}
  .ticket .top{display:flex;justify-content:space-between;align-items:center}
  .ticket .tt{font-weight:700;font-size:16px}
  .ticket .waiter{font-size:12px;color:var(--muted)}
  .line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .line .q{color:var(--muted);width:30px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
  input,select{background:var(--ink);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;width:100%}
  .modal{position:fixed;inset:0;background:rgba(2,6,23,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:16px}
  .sheet h3{margin:0 0 12px}
  .paybtn{flex:1;text-align:center;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel2)}
  .paybtn.cash{background:#14532d;color:#bbf7d0;border-color:#166534}
  .paybtn.momo{background:#1e3a5f;color:#bae6fd;border-color:#1d4ed8}
  .paybtn.credit{background:#3b0764;color:#e9d5ff;border-color:#7c3aed}
  .kpi{background:var(--panel);border-radius:12px;padding:14px}
  .kpi .n{font-size:24px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:3px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.open{background:#1d4ed8;color:#fff}
  .pill.served{background:#b45309;color:#fff}
  .pill.paid{background:#15803d;color:#fff}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#04141f;border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:80}
  .toast.on{display:block}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted)}
  .addfoot{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:40}
  textarea{width:100%;background:var(--ink);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-family:inherit;font-size:14px}
</style>
</head>
<body>

<header>
  <h1>🍸 FieldBar POS</h1>
  <button class="btn ghost sm" onclick="showOwner()">Owner</button>
  <button class="btn sm" onclick="openNightSummary()">Close Night</button>
</header>

<div class="tabbar" id="tabbar">
  <div class="tab on" data-v="floor" onclick="switchView('floor')">Floor / Tickets</div>
  <div class="tab" data-v="menu" onclick="switchView('menu')">Menu & Stock</div>
  <div class="tab" data-v="credit" onclick="switchView('credit')">Customer Credit</div>
  <div class="tab" data-v="waiter" onclick="switchView('waiter')">Waiters</div>
</div>

<!-- FLOOR / TICKETS -->
<div class="view on" id="v-floor">
  <div class="row">
    <button class="btn" onclick="openNewTicket()">+ New Ticket / Table</button>
    <select id="fFloor" onchange="renderFloor()" class="ghost" style="max-width:160px">
      <option value="">All tickets</option><option value="open">Open</option><option value="served">Served</option><option value="paid">Paid</option>
    </select>
  </div>
  <div id="floorList"></div>
</div>

<!-- MENU & STOCK -->
<div class="view" id="v-menu">
  <div class="row">
    <button class="btn" onclick="openProductEditor()">+ Add Item</button>
    <input id="mSearch" placeholder="Search menu…" oninput="renderMenu()" style="flex:1">
  </div>
  <div class="grid cards" id="menuGrid"></div>
</div>

<!-- CUSTOMER CREDIT -->
<div class="view" id="v-credit">
  <div class="row">
    <button class="btn" onclick="openCreditEditor()">+ New Customer</button>
  </div>
  <div id="creditList"></div>
</div>

<!-- WAITERS -->
<div class="view" id="v-waiter">
  <div class="row"><button class="btn" onclick="openWaiterEditor()">+ Add Waiter</button></div>
  <div id="waiterStats"></div>
</div>

<!-- OWNER MODAL -->
<div class="modal" id="ownerModal">
  <div class="sheet">
    <h3>Owner Dashboard</h3>
    <div class="grid cards" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">
      <div class="kpi"><div class="n" id="oSales">0</div><div class="l">Today sales (GHS)</div></div>
      <div class="kpi"><div class="n" id="oCash">0</div><div class="l">Cash</div></div>
      <div class="kpi"><div class="n" id="oMomo">0</div><div class="l">MoMo</div></div>
      <div class="kpi"><div class="n" id="oTab">0</div><div class="l">Tab / Credit</div></div>
      <div class="kpi"><div class="n" id="oTix">0</div><div class="l">Tickets</div></div>
      <div class="kpi"><div class="n" id="oLow">0</div><div class="l">Low stock items</div></div>
    </div>
    <h3 style="margin-top:16px">Top waiters (today)</h3>
    <div id="ownerWaiters"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" onclick="exportData()">Export Backup</button>
      <button class="btn ghost" onclick="closeModal('ownerModal')">Close</button>
    </div>
  </div>
</div>

<!-- NEW TICKET -->
<div class="modal" id="ticketModal">
  <div class="sheet">
    <h3>New Ticket</h3>
    <label class="small muted">Table / Tag</label>
    <input id="tTable" placeholder="e.g. T3 or Walk-in">
    <label class="small muted" style="display:block;margin-top:10px">Customer name (for credit tab)</label>
    <input id="tCust" placeholder="optional">
    <label class="small muted" style="display:block;margin-top:10px">Waiter</label>
    <select id="tWaiter"></select>
    <div class="addfoot" style="position:static;border:0;padding:14px 0 0">
      <button class="btn ghost" onclick="closeModal('ticketModal')">Cancel</button>
      <button class="btn" onclick="createTicket()">Open Ticket</button>
    </div>
  </div>
</div>

<!-- TICKET DETAIL / ORDER -->
<div class="modal" id="orderModal">
  <div class="sheet">
    <h3 id="orderTitle">Ticket</h3>
    <div id="orderItems"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <div class="row">
      <select id="oProduct"></select>
    </div>
    <div class="row">
      <input id="oQty" type="number" min="1" value="1" style="max-width:90px">
      <button class="btn" onclick="addToTicket()">+ Add to ticket</button>
    </div>
    <div id="orderTotal" style="font-weight:800;font-size:18px;margin:10px 0"></div>
    <div class="row">
      <div class="paybtn cash" onclick="payTicket('cash')">Cash</div>
      <div class="paybtn momo" onclick="payTicket('momo')">MoMo</div>
      <div class="paybtn credit" onclick="payTicket('credit')">Credit</div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" onclick="closeModal('orderModal')">Close</button>
    </div>
  </div>
</div>

<!-- PRODUCT EDITOR -->
<div class="modal" id="prodModal">
  <div class="sheet">
    <h3 id="prodTitle">Add Menu Item</h3>
    <input id="pName" placeholder="Item name (e.g. Star Beer)">
    <input id="pCat" placeholder="Category (Beer, Spirits, Food…)" style="margin-top:8px">
    <input id="pPrice" type="number" placeholder="Price (GHS)" style="margin-top:8px">
    <input id="pStock" type="number" placeholder="Stock qty" style="margin-top:8px">
    <input id="pLow" type="number" placeholder="Low-stock alert at (default 5)" style="margin-top:8px">
    <div class="addfoot" style="position:static;border:0;padding:14px 0 0">
      <button class="btn ghost" onclick="closeModal('prodModal')">Cancel</button>
      <button class="btn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<!-- CREDIT EDITOR -->
<div class="modal" id="credModal">
  <div class="sheet">
    <h3>New Credit Customer</h3>
    <input id="cName" placeholder="Customer name">
    <input id="cPhone" placeholder="Phone (for SMS bill)" style="margin-top:8px">
    <input id="cLimit" type="number" placeholder="Credit limit (GHS, optional)" style="margin-top:8px">
    <div class="addfoot" style="position:static;border:0;padding:14px 0 0">
      <button class="btn ghost" onclick="closeModal('credModal')">Cancel</button>
      <button class="btn" onclick="saveCredit()">Save</button>
    </div>
  </div>
</div>

<!-- WAITER EDITOR -->
<div class="modal" id="waitModal">
  <div class="sheet">
    <h3>Add Waiter</h3>
    <input id="wName" placeholder="Waiter name">
    <div class="addfoot" style="position:static;border:0;padding:14px 0 0">
      <button class="btn ghost" onclick="closeModal('waitModal')">Cancel</button>
      <button class="btn" onclick="saveWaiter()">Save</button>
    </div>
  </div>
</div>

<!-- NIGHT SUMMARY -->
<div class="modal" id="nightModal">
  <div class="sheet">
    <h3>Close Night — Summary</h3>
    <pre id="nightText" style="white-space:pre-wrap;font-size:13px;line-height:1.5"></pre>
    <div class="row">
      <button class="btn ghost" onclick="sendNightSMS()">SMS to Owner</button>
      <button class="btn ghost" onclick="exportData()">Export</button>
      <button class="btn" onclick="closeModal('nightModal')">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== FieldBar POS — offline-first bar/nightclub POS =======
   Reuses the FieldSales Pro local-first model (localStorage, no server).
   Model: products(stock) -> tables/tickets(waiter) -> payment(cash/momo/credit)
   -> customer credit -> owner summary + SMS (graceful offline). */
const KEY='fieldbar_v1';
const SMS_CONFIG={enabled:false, gateway:null, ownerPhone:''}; // set when a gateway is wired
const SEED_PRODUCTS=[
  {id:'b1',name:'Star Beer',cat:'Beer',price:8,stock:60,low:15},
  {id:'b2',name:'Guinness',cat:'Beer',price:12,stock:40,low:10},
  {id:'b3',name:'Gin (shot)',cat:'Spirits',price:10,stock:50,low:12},
  {id:'b4',name:'Tonic/Soda',cat:'Mixers',price:4,stock:80,low:20},
  {id:'f1',name:'SmallChops',cat:'Food',price:15,stock:30,low:8},
];
const SEED_WAITERS=[{id:'w1',name:'Kofi'},{id:'w2',name:'Ama'}];

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.products)return d;}catch(e){}
  return {products:SEED_PRODUCTS.slice(),waiters:SEED_WAITERS.slice(),tickets:[],credit:[],sales:[],smsLog:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function todayStr(){return new Date().toISOString().slice(0,10);}
function money(n){return 'GHS '+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
function $(s){return document.querySelector(s);}
let DB=load();
let activeTicket=null;

/* ---------- views ---------- */
function switchView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('#v-'+v).classList.add('on');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));if(v==='floor')renderFloor();if(v==='menu')renderMenu();if(v==='credit')renderCredit();if(v==='waiter')renderWaiter();}

/* ---------- floor / tickets ---------- */
function renderFloor(){
  const f=$('#fFloor').value;
  let t=DB.tickets.filter(x=>!f||x.status===f).sort((a,b)=>a.created-b.created);
  if(!t.length){$('#floorList').innerHTML='<p class="muted">No tickets. Tap “+ New Ticket”.</p>';return;}
  $('#floorList').innerHTML=t.map(x=>{
    const total=x.items.reduce((s,i)=>s+i.qty*i.price,0);
    const itemLines=x.items.map(i=>`<div class="line"><span class="q">${i.qty}×</span><span>${i.name}</span><span>${money(i.qty*i.price)}</span></div>`).join('');
    return `<div class="ticket">
      <div class="top"><span class="tt">${x.table||'Walk-in'}</span><span class="pill ${x.status}">${x.status}</span></div>
      <div class="waiter">Waiter: ${waiterName(x.waiterId)} ${x.customer?'· '+x.customer:''}</div>
      ${itemLines}
      <div style="text-align:right;font-weight:800;margin-top:6px">${money(total)}</div>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" onclick="openOrder('${x.id}')">Open / Add</button>
        ${x.status!=='paid'?`<button class="btn ghost sm" onclick="markServed('${x.id}')">Mark Served</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function waiterName(id){const w=DB.waiters.find(x=>x.id===id);return w?w.name:'—';}
function openNewTicket(){$('#tTable').value='';$('#tCust').value='';fillWaiter('#tWaiter');openModal('ticketModal');}
function fillWaiter(sel){$(sel).innerHTML='<option value="">—</option>'+DB.waiters.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');}
function createTicket(){
  const table=$('#tTable').value.trim()||'Walk-in';
  DB.tickets.push({id:'t'+Date.now(),table,customer:$('#tCust').value.trim(),waiterId:$('#tWaiter').value||null,items:[],status:'open',created:Date.now(),paidVia:null});
  save();closeModal('ticketModal');switchView('floor');toast('Ticket opened');
}
function markServed(id){const t=DB.tickets.find(x=>x.id===id);if(t){t.status='served';save();renderFloor();toast('Marked served');}}

function openOrder(id){
  activeTicket=DB.tickets.find(x=>x.id===id);if(!activeTicket)return;
  $('#orderTitle').textContent=activeTicket.table+' · '+waiterName(activeTicket.waiterId);
  renderOrder();
  $('#oProduct').innerHTML='<option value="">Product…</option>'+DB.products.map(p=>`<option value="${p.id}">${p.name} — ${money(p.price)} (stock ${p.stock})</option>`).join('');
  openModal('orderModal');
}
function renderOrder(){
  const t=activeTicket;
  $('#orderItems').innerHTML=t.items.length?t.items.map(i=>`<div class="line"><span class="q">${i.qty}×</span><span>${i.name}</span><span>${money(i.qty*i.price)} <button class="btn ghost sm" onclick="delItem('${i.id}')">x</button></span></div>`).join('') : '<p class="muted">No items yet.</p>';
  const total=t.items.reduce((s,i)=>s+i.qty*i.price,0);
  $('#orderTotal').textContent='Total: '+money(total);
}
function delItem(iid){activeTicket.items=activeTicket.items.filter(i=>i.id!==iid);save();renderOrder();}
function addToTicket(){
  const pid=$('#oProduct').value, q=Math.max(1,+$('#oQty').value||1);
  const p=DB.products.find(x=>x.id===pid);if(!p){toast('Pick a product');return;}
  const existing=activeTicket.items.find(i=>i.productId===pid);
  if(existing)existing.qty+=q; else activeTicket.items.push({id:'i'+Date.now(),productId:pid,name:p.name,price:p.price,qty:q});
  // decrement stock
  p.stock=Math.max(0,(p.stock||0)-q);
  save();renderOrder();toast(p.name+' added');
}
function payTicket(mode){
  const t=activeTicket;const total=t.items.reduce((s,i)=>s+i.qty*i.price,0);
  if(!t.items.length){toast('Add items first');return;}
  t.status='paid';t.paidVia=mode;t.paidAt=Date.now();
  DB.sales.push({id:'s'+Date.now(),ticketId:t.id,table:t.table,waiterId:t.waiterId,customer:t.customer,items:t.items.slice(),total,mode,date:todayStr()});
  // credit: attach to customer account
  if(mode==='credit'){
    let c=DB.credit.find(x=>x.name&&t.customer&&x.name.toLowerCase()===t.customer.toLowerCase());
    if(!c&&t.customer){c={id:'c'+Date.now(),name:t.customer,phone:'',limit:0,balance:0};DB.credit.push(c);}
    if(c)c.balance=(+c.balance||0)+total;
    if(c&&c.phone)queueSMS(c.phone,`Hi ${c.name}, your FieldBar bill is ${money(total)}. Thank you!`);
  }
  save();closeModal('orderModal');switchView('floor');toast('Paid via '+mode);
}

/* ---------- menu / stock ---------- */
function renderMenu(){
  const q=$('#mSearch').value.toLowerCase();
  const items=DB.products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(q));
  $('#menuGrid').innerHTML=items.map(p=>{
    const low=(p.stock!=null&&p.low!=null&&p.stock<=p.low);
    return `<div class="pcard ${low?'low':''}" onclick="openProductEditor('${p.id}')">
      <div class="nm">${p.name}</div><div class="pr">${money(p.price)}</div>
      <div class="st">${p.cat||''} · stock ${p.stock??'—'}</div></div>`;
  }).join('')||'<p class="muted">No items.</p>';
}
let editPid=null;
function openProductEditor(id){editPid=id||null;$('#prodTitle').textContent=id?'Edit Item':'Add Menu Item';
  const p=id?DB.products.find(x=>x.id===id):null;
  $('#pName').value=p?p.name:'';$('#pCat').value=p?p.cat:'';$('#pPrice').value=p?p.price:'';
  $('#pStock').value=p?(p.stock??''):'';$('#pLow').value=p?(p.low??''):'';
  openModal('prodModal');}
function saveProduct(){
  const name=$('#pName').value.trim();if(!name){toast('Name required');return;}
  const data={name,cat:$('#pCat').value.trim(),price:+$('#pPrice').value||0,stock:+$('#pStock').value||0,low:+$('#pLow').value||5};
  if(editPid){Object.assign(DB.products.find(x=>x.id===editPid),data);}else{data.id='p'+Date.now();DB.products.push(data);}
  save();closeModal('prodModal');renderMenu();toast('Saved');
}

/* ---------- credit ---------- */
function renderCredit(){
  if(!DB.credit.length){$('#creditList').innerHTML='<p class="muted">No credit customers yet.</p>';return;}
  $('#creditList').innerHTML=DB.credit.map(c=>`<div class="ticket">
    <div class="top"><span class="tt">${c.name}</span><span class="pill ${+c.balance>0?'open':'paid'}">${money(c.balance||0)}</span></div>
    <div class="waiter">${c.phone||'no phone'} ${c.limit?('· limit '+money(c.limit)):''}</div>
    <div class="row" style="margin-top:6px">
      <button class="btn sm" onclick="payCredit('${c.id}')">Record Payment</button>
    </div></div>`).join('');
}
function openCreditEditor(){$('#cName').value='';$('#cPhone').value='';$('#cLimit').value='';openModal('credModal');}
function saveCredit(){const name=$('#cName').value.trim();if(!name){toast('Name required');return;}
  DB.credit.push({id:'c'+Date.now(),name,phone:$('#cPhone').value.trim(),limit:+$('#cLimit').value||0,balance:0});save();closeModal('credModal');renderCredit();toast('Customer added');}
function payCredit(id){const c=DB.credit.find(x=>x.id===id);if(!c)return;const amt=prompt('Payment amount (GHS) for '+c.name);if(amt==null)return;c.balance=Math.max(0,(+c.balance||0)-(+amt||0));save();renderCredit();toast('Payment recorded');}

/* ---------- waiters ---------- */
function renderWaiter(){
  if(!DB.waiters.length){$('#waiterStats').innerHTML='<p class="muted">No waiters added.</p>';return;}
  const today=todayStr();
  const rows=DB.waiters.map(w=>{
    const sales=DB.sales.filter(s=>s.waiterId===w.id&&s.date===today);
    const sum=sales.reduce((a,s)=>a+s.total,0);
    return {w,count:sales.length,sum};
  }).sort((a,b)=>b.sum-a.sum);
  $('#waiterStats').innerHTML='<table><tr><th>Waiter</th><th>Tickets today</th><th>Sales</th></tr>'+
    rows.map(r=>`<tr><td>${r.w.name}</td><td>${r.count}</td><td>${money(r.sum)}</td></tr>`).join('')+'</table>';
}
function openWaiterEditor(){$('#wName').value='';openModal('waitModal');}
function saveWaiter(){const n=$('#wName').value.trim();if(!n){toast('Name required');return;}DB.waiters.push({id:'w'+Date.now(),name:n});save();closeModal('waitModal');renderWaiter();toast('Waiter added');}

/* ---------- owner / summary ---------- */
function showOwner(){
  const today=todayStr();const s=DB.sales.filter(x=>x.date===today);
  const cash=s.filter(x=>x.mode==='cash').reduce((a,x)=>a+x.total,0);
  const momo=s.filter(x=>x.mode==='momo').reduce((a,x)=>a+x.total,0);
  const tab=s.filter(x=>x.mode==='credit').reduce((a,x)=>a+x.total,0);
  const low=DB.products.filter(p=>p.stock!=null&&p.low!=null&&p.stock<=p.low);
  $('#oSales').textContent=money(s.reduce((a,x)=>a+x.total,0));
  $('#oCash').textContent=money(cash);$('#oMomo').textContent=money(momo);$('#oTab').textContent=money(tab);
  $('#oTix').textContent=s.length;$('#oLow').textContent=low.length;
  const ranked=DB.waiters.map(w=>{const ws=DB.sales.filter(x=>x.waiterId===w.id&&x.date===today);return{w,n:ws.length,sum:ws.reduce((a,x)=>a+x.total,0)};}).sort((a,b)=>b.sum-a.sum);
  $('#ownerWaiters').innerHTML=ranked.length?'<table><tr><th>Waiter</th><th>Sales</th></tr>'+ranked.map(r=>`<tr><td>${r.w.name}</td><td>${money(r.sum)}</td></tr>`).join('')+'</table>':'<p class="muted">No sales yet.</p>';
  openModal('ownerModal');
}
function nightSummaryText(){
  const today=todayStr();const s=DB.sales.filter(x=>x.date===today);
  const cash=s.filter(x=>x.mode==='cash').reduce((a,x)=>a+x.total,0);
  const momo=s.filter(x=>x.mode==='momo').reduce((a,x)=>a+x.total,0);
  const tab=s.filter(x=>x.mode==='credit').reduce((a,x)=>a+x.total,0);
  const low=DB.products.filter(p=>p.stock!=null&&p.low!=null&&p.stock<=p.low).map(p=>p.name+' ('+p.stock+')');
  let txt=`FIELD BAR — NIGHT SUMMARY (${today})\n`;
  txt+=`Total sales: ${money(s.reduce((a,x)=>a+x.total,0))}\n`;
  txt+=`Cash: ${money(cash)} | MoMo: ${money(momo)} | Tab/Credit: ${money(tab)}\n`;
  txt+=`Tickets: ${s.length}\n`;
  const ranked=DB.waiters.map(w=>{const ws=DB.sales.filter(x=>x.waiterId===w.id&&x.date===today);return{w,sum:ws.reduce((a,x)=>a+x.total,0)};}).sort((a,b)=>b.sum-a.sum);
  txt+='Top waiters: '+(ranked.length?ranked.map(r=>r.w.name+' '+money(r.sum)).join(', '):'—')+'\n';
  txt+='Low stock: '+(low.length?low.join(', '):'none')+'\n';
  return txt;
}
function openNightSummary(){$('#nightText').textContent=nightSummaryText();openModal('nightModal');}
function sendNightSMS(){if(!SMS_CONFIG.enabled||!SMS_CONFIG.ownerPhone){toast('SMS not configured (offline-safe)');return;}
  queueSMS(SMS_CONFIG.ownerPhone,nightSummaryText());toast('Night summary queued to owner');}

/* ---------- SMS (gateway-ready, graceful offline) ---------- */
function queueSMS(phone,msg){
  DB.smsLog.push({phone,msg,at:Date.now(),sent:false});save();
  // Real send would POST to SMS_CONFIG.gateway (Hubtel/Arkesel). Stubbed so app works fully offline.
  console.log('[SMS stub]',phone,msg);
}

/* ---------- export ---------- */
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fieldbar_backup_'+todayStr()+'.json';a.click();toast('Backup exported');}

/* ---------- modal helpers ---------- */
function openModal(id){$('#'+id).classList.add('on');}
function closeModal(id){$('#'+id).classList.remove('on');}

/* ---------- boot ---------- */
renderFloor();
</script>
